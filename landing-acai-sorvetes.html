<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff3b65">
  <title>AÇAI & SORVETES • Faça seu pedido por WhatsApp</title>
  <style>
    :root{
      --bg:#fff6f7;
      --card:#fff;
      --accent:#ff3b65;
      --text:#1a1a1a;
      --sub:#6b6b6b;
      --border:#ffd6dd;
      --shadow:0 2px 12px rgba(255,59,101,.08);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
    body{background:var(--bg);color:var(--text);padding:14px}
    .wrap{max-width:900px;margin:0 auto}
    header{text-align:center;margin:6px 0 16px}
    header h1{font-size:24px;font-weight:800;color:var(--accent)}
    header p{font-size:13px;color:var(--sub)}
    .tabs{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .tab{padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
      background:var(--card);border:2px solid var(--border);color:var(--sub);box-shadow:var(--shadow);transition:.18s}
    .tab.ativo{background:var(--accent);color:#fff;border-color:var(--accent)}
    .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:8px;
      text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
    .card:hover{transform:translateY(-3px);border-color:var(--accent)}
    .card img{width:100%;height:64px;object-fit:cover;border-radius:8px;margin-bottom:6px}
    .card h3{font-size:13px;font-weight:700;margin:2px 0}
    .card .preco{font-size:15px;font-weight:800;color:var(--accent);margin:3px 0}
    .card .sub{font-size:11px;color:var(--sub)}
    .wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D36EA;color:#fff;
      border:none;border-radius:50px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;
      text-decoration:none;width:100%;margin:18px 0;box-shadow:0 4px 16px rgba(37,211,110,.35);transition:.18s}
    .wa-btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
    .wa-svg{width:22px;height:22px;flex-shrink:0}
    #modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;
      justify-content:center;z-index:90;cursor:pointer}
    #modal img{max-width:90vw;max-height:85vh;border-radius:12px}
    footer{text-align:center;margin-top:16px;font-size:12px;color:var(--sub)}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍦 AÇAI & SORVETES</h1>
    <p>Faça seu pedido pelo WhatsApp</p>
  </header>

  <div class="tabs">
    <div class="tab ativo" onclick="show('acai')">🥣 AÇAI</div>
    <div class="tab" onclick="show('sorvetes')">🍨 SORVETES</div>
  </div>

  <div id="cat-acai" class="cat active">
    <div class="produtos" id="list-acai"></div>
  </div>
  <div id="cat-sorvetes" class="cat">
    <div class="produtos" id="list-sorvetes"></div>
  </div>

  <a href="https://wa.me/5521965112878?text=Ol%C3%A1%2C%20gostaria%20de%20fazer%20um%20pedido%20na%20LOJA%20DE%20SORVETE%20E%20A%C3%87AI%20!"
     id="whatsapp-link" target="_blank" class="wa-btn">
    <svg class="wa-svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12.04 18.54c-3.05 0-5.97-.81-8.31-2.31l-.94-.54.14-1.1.73 2.68 2.27 1.38 3.17 1.48-.68 2.08 1.47 1.04 2.57-1.57 3.05-.45.58 1.3 1.17 2.27-1.36 1.68-2.21 2.5-3.65 2.5-5.18 0-3.26-2.64-5.9-5.9-5.9-1.47 0-2.88.55-3.98 1.59l-.04-.03c-.09 0-.17.01-.26.01-3.41 0-6.17 2.77-6.17 6.18 0 1.48.42 2.9 1.17 4.08l-.8 2.58c-.1.3-.16.3-.24.3-.07-.01-.2-.05-.1-.3.01-.01 0-.01.01-.02l1.97-5.42c-.06-.1-.1-.2-.1-.3v-.03c0-.46-.37-.84-.84-.84-.46 0-.84.37-.84.84v.03c0 .37.3.68.68.75.04.01.07.01.11.02 3.13 6.06 9.5 9.35 15.35 7.5l4.24-.94c4.15-1.45 6.8-5.27 6.38-9.66-.44-4.64-4.26-8.14-8.88-8.14z"/>
    </svg>
    Pedir pelo WhatsApp
  </a>

  <div id="modal" onclick="closeModal()">
    <img id="modalImg" alt="ampliado">
  </div>

  <footer>🍦 Açai & Sorvetes Artesanais • (21) 96511-2878</footer>
</div>

<!-- JSON Inline (fallback offline) -->
<script>
var EDITOR_DATA = {"store":"LOJA DE SORVETE E AÇ AI","whatsapp":"5521965112878","sabores":[{"name":"Chocolate 50%","price":"12,00","img":"/landing-assets/img/sabor-chocolate.png"},{"name":"Pistache","price":"13,00","img":"/landing-assets/img/sabor-pistache.png"},{"name":"Creme de Leite","price":"11,50","img":"/landing-assets/img/sabor-creme.png"},{"name":"Napolitano","price":"14,00","img":"/landing-assets/img/sabor-napolitano.png"},{"name":"Morango","price":"8,50","img":"/landing-assets/img/sabores-10.png"},{"name":"Maracaju","price":"8,50","img":"/landing-assets/img/sabores-10.png"},{"name":"Menta","price":"8,00","img":"/landing-assets/img/sabores-10.png"},{"name":"Doce de Leite","price":"9,50","img":"/landing-assets/img/sabores-10.png"},{"name":"Limão","price":"8,00","img":"/landing-assets/img/sabores-10.png"},{"name":"Abacaxi","price":"8,50","img":"/landing-assets/img/sabores-10.png"}]};
</script>

<script>
function show(cat){
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  document.getElementById('cat-'+cat).classList.add('active');
  document.querySelector('.tab[onclick="show(\''+cat+'\')"]').classList.add('ativo');
}
function openImg(src,alt){
  const m=document.getElementById('modal');
  document.getElementById('modalImg').src=src || EDITOR_DATA.gallery[0].img;
  document.getElementById('modalImg').alt=alt||'ampliado';
  m.style.display='flex';document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').style.display='none';document.body.style.overflow='';}
document.getElementById('modal').addEventListener('click',closeModal);

(function(){
  /* Tenta fetch do server (live-sync); fallback pro JSON inline (offline) */
  function render(d){
    const acai=d.sabores.slice(0,4); /* 4 primeiros com foto = AÇAI */
    const sorvetes=d.sabores.slice(4); /* 6 restantes (grid) = SORVETES */
    document.getElementById('list-acai').innerHTML=acai.map(s=>`<div class="card" onclick="openImg('${s.img}','${s.name}')"><img src="${s.img}" alt="${s.name}"><h3>${s.name}</h3><p class="preco">R$ ${s.price}</p></div>`).join('');
    document.getElementById('list-sorvetes').innerHTML=sorvetes.map(s=>`<div class="card" onclick="openImg('${s.img}','${s.name}')"><img src="${s.img}" alt="${s.name}"><h3>${s.name}</h3><p class="preco">R$ ${s.price}</p></div>`).join('');
    const st=document.querySelector('h1'); if(d.store) st.textContent='🍦 '+d.store.replace(/ACAI/,'AÇAI');
    const msg=encodeURIComponent('Olá, gostaria de fazer um pedido na '+d.store+'!');
    document.querySelectorAll('a[href*="wa.me"]').forEach(a=>{const u=new URL(a.href);u.search='?text='+msg;a.href=u.toString()});
  }
  /* Tenta server → live-sync; senão usa JSON inline (file://) */
  fetch('/api/data').then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>render(EDITOR_DATA));
})();
</script>
</body>
</html>
